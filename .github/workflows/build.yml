name: Build KUQuickML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kuquickmlv4.0_english.py'
      - 'dialogs/**'
      - 'icon.png'
      - 'requirements-kuquickml-build.txt'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            entry: kuquickmlv4.0_english.py
            artifact_name: KUQuickML-EN-Windows
            data_sep: ';'
          - os: macos-latest
            entry: kuquickmlv4.0_english.py
            artifact_name: KUQuickML-EN-macOS
            data_sep: ':'
          - os: ubuntu-latest
            entry: kuquickmlv4.0_english.py
            artifact_name: KUQuickML-EN-Linux
            data_sep: ':'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-kuquickml-build.txt

      - name: Verify Optuna import
        run: |
          python -c "import optuna; print('optuna', optuna.__version__)"

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name KUQuickML \
            --add-data "dialogs${{ matrix.data_sep }}dialogs" \
            --add-data "icon.png${{ matrix.data_sep }}." \
            --collect-all sklearn \
            --collect-all scipy \
            --collect-all numpy \
            --collect-all matplotlib \
            --collect-all mplcursors \
            --collect-all seaborn \
            --collect-all joblib \
            --collect-all optuna \
            --collect-all PyQt5 \
            --collect-binaries sklearn \
            --collect-binaries scipy \
            --collect-binaries numpy \
            --copy-metadata scikit-learn \
            --copy-metadata scipy \
            --copy-metadata numpy \
            --copy-metadata optuna \
            --recursive-copy-metadata optuna \
            --hidden-import sklearn._distributor_init \
            "${{ matrix.entry }}"

      - name: Copy sklearn .libs on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          import sklearn

          src = Path(sklearn.__file__).resolve().parent / ".libs"
          dst = Path("dist/KUQuickML/_internal/sklearn/.libs")

          print("sklearn path:", Path(sklearn.__file__).resolve().parent)
          print("source .libs:", src)
          print("source exists:", src.exists())

          if not src.exists():
              raise SystemExit("ERROR: sklearn/.libs not found in build environment")

          dst.parent.mkdir(parents=True, exist_ok=True)

          if dst.exists():
              shutil.rmtree(dst)

          shutil.copytree(src, dst)
          print("Copied:", src, "->", dst)
          PY

      - name: Verify sklearn .libs on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -la dist/KUQuickML/_internal/sklearn || true
          ls -la dist/KUQuickML/_internal/sklearn/.libs || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/KUQuickML/**
          if-no-files-found: error
